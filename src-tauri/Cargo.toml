[package]
name = "openflyover"
version = "4.4.1"
description = "Films de survol 3D à partir de traces GPX et FIT"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# the "_lib" suffix avoids a name clash with the binary on Windows (cargo issue 8519)
name = "openflyover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
# `generate_context!` writes the `plugins` section of the config (updater.conf.json) as `serde_json` values
serde_json = "1"
# « Importer depuis Strava »: the redirect is caught on 127.0.0.1, Strava opens in the system browser
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
# memory and processor load shown in the status bar (system.rs); 0.36 is the last release for rust-version 1.77
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# « Rechercher une mise à jour »: desktop only, registered by lib.rs only when updater.conf.json is merged into the config
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
