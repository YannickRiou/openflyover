<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b2832" />
    <meta name="apple-mobile-web-app-title" content="OpenFlyover" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenFlyover</title>
  </head>
  <body>
    <script>
      // iPhone or iPad (an iPad says Macintosh, with touch): the room left for the status bar (theme.css, --safe-top)
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
        document.documentElement.classList.add('is-ios')
      }
      // theme of the stored preferences before the first paint (the app applies them all again at start-up)
      try {
        var a = JSON.parse(localStorage.getItem('openflyover.preferences.v1')).appearance
        var d = document.documentElement.dataset
        d.theme = a.theme === 'dark' || (a.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <div id="root"></div>
    <div class="status-edge" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
