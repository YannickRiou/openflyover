# The website on GitHub Pages (https://yannickriou.github.io/openflyover/), rebuilt on every push to master. One-time
# setting: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # the user guide in each language next to the site (« Premiers pas » on the home screen opens the one of the
      # interface): its links to the repository's Markdown point to GitHub
      - name: User guide
        run: |
          mkdir -p dist/docs
          cp -r docs/images dist/docs/
          for guide in docs/user-guide*.html; do
            sed -e 's#href="sources.md#href="https://github.com/${{ github.repository }}/blob/master/docs/sources.md#g' \
                -e 's#href="../README.md"#href="https://github.com/${{ github.repository }}"#g' \
                "$guide" > "dist/$guide"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
