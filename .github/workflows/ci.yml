# Checks on pull requests and on master: lint, unit tests with coverage and production build with its type check (lint,
# test and build jobs, in parallel), and the Rust tests of the desktop app only when src-tauri or this file changed (rust job: its Linux libraries
# alone take minutes to install). The Rust tests do not use the site, so they build against a placeholder dist/. The
# types are also checked on Windows and macOS (types-os job). The end-to-end tests run every night (e2e.yml). On
# master, the line coverage feeds the README badge (badge job, `badges` branch).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # lint, unit tests and build in parallel (each installs the dependencies from the npm cache)
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # two paths that differ only in casing (ui/TrackTools.tsx and ui/trackTools.ts, once) build on Linux and fail on
      # Windows and macOS, where the desktop installers are made
      - name: Paths that differ only in casing
        run: |
          dups=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "Chemins qui ne diffèrent que par la casse :"; echo "$dups"; exit 1; fi
      # the user guide in every language of the interface, with the same sections, anchors and pictures
      - run: node scripts/check-user-guides.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # coverage only on master, for the badge: it makes the run about 60 % longer (35 s → 56 s on 4 cores)
      - run: npm run ${{ github.event_name == 'push' && 'coverage' || 'test' }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage-summary.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `tsc -b` type checks both projects (tsconfig.app.json, tsconfig.node.json) before the Vite build: no separate typecheck step
      - run: npm run build
      # what a visitor downloads before the home screen shows, gzipped, under its budget
      - run: node scripts/check-bundle-size.mjs

  # the installers are built on Windows and macOS, whose file systems ignore casing: an import that resolves on Linux
  # and not there (4.2.0 and 4.2.1 failed so) shows here, in the pull request
  types-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src-tauri .github/workflows/ci.yml 2>/dev/null; then
            echo 'rust=false' >> "$GITHUB_OUTPUT"
            echo 'src-tauri inchangé : tests Rust ignorés.'
          else
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: steps.changed.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - if: steps.changed.outputs.rust == 'true'
        run: mkdir -p dist && echo '<!doctype html><title>placeholder</title>' > dist/index.html
      - if: steps.changed.outputs.rust == 'true'
        run: cargo test --locked
        working-directory: src-tauri

  badge:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}
      # a shields.io endpoint file on its own branch, read by the README badge; committed only when the value changes
      - run: |
          git config user.name 'Yannick Riou'
          git config user.email '59170639+YannickRiou@users.noreply.github.com'
          if git fetch -q origin badges; then git switch -qc badges FETCH_HEAD; else git switch -q --orphan badges; fi
          pct=$(jq -r '.total.lines.pct | floor' "$RUNNER_TEMP/coverage-summary.json")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"1C2A33"}\n' "$pct" > coverage.json
          git add coverage.json
          git diff --cached --quiet || { git commit -qm "Coverage badge: $pct% of lines" && git push -q origin badges; }
