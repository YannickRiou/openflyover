# Exported films must stay the same frame for frame unless a change is about the film itself. On a pull request that
# touches the app, the same short film (e2e/export-frames.mjs: the sample, 320 × 180, 2 s, no volumetric clouds) is
# exported from the base branch and from the pull request, one after the other on the same runner, and their decoded
# frames compared (ffmpeg framemd5). A difference fails the check, with both films as an artifact; the label
# `film-change` on the pull request accepts it on purpose (say why in the pull request).
name: Export regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'e2e/export-frames.mjs'

concurrency:
  group: export-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENFLYOVER_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            head/package-lock.json
            base/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
        working-directory: head
      - run: npm ci
        working-directory: base
      # the script of the pull request drives both apps (the base may not have it yet)
      - name: Film of the base branch
        run: node head/e2e/export-frames.mjs base "$RUNNER_TEMP/base.mp4"
      - name: Film of the pull request
        run: node head/e2e/export-frames.mjs head "$RUNNER_TEMP/head.mp4"
      - name: Compare the frames
        id: compare
        run: |
          frames() { ffmpeg -v error -i "$1" -map 0:v -f framemd5 - | grep -v '^#'; }
          frames "$RUNNER_TEMP/base.mp4" > "$RUNNER_TEMP/base.md5"
          frames "$RUNNER_TEMP/head.mp4" > "$RUNNER_TEMP/head.md5"
          if diff -q "$RUNNER_TEMP/base.md5" "$RUNNER_TEMP/head.md5" > /dev/null; then
            echo "Same film: $(wc -l < "$RUNNER_TEMP/head.md5") frames identical."
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "The exported film changed:"
            diff "$RUNNER_TEMP/base.md5" "$RUNNER_TEMP/head.md5" | head -20 || true
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.same == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: films
          path: |
            ${{ runner.temp }}/base.mp4
            ${{ runner.temp }}/head.mp4
      - if: steps.compare.outputs.same == 'false' && !contains(github.event.pull_request.labels.*.name, 'film-change')
        run: |
          echo "::error::The exported film differs from the base branch's. If that is the point of the change, add the label film-change and say why in the pull request; the two films are in the artifact « films »."
          exit 1
