# The end-to-end scenarios (e2e/run.mjs: the real app in a headless Chrome on a software GPU). They run on the pull
# request of a release branch (release/*), so each release is checked before it goes out, and on demand
# (`gh workflow run e2e.yml --ref <branch>`). Too slow for every pull request (the export alone takes minutes), and
# the export needs the tile servers. A failure leaves the screenshots of the failed scenarios as an artifact.
name: E2E

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
        env:
          # Chrome is installed on the runner
          OPENFLYOVER_CHROME: /usr/bin/google-chrome
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/openflyover-e2e-*/*.png
          if-no-files-found: ignore
